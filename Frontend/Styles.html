<!--
  @file Styles.html
  @description Defines the shared visual design and responsive layout for the
  ACAT Management Application frontend.

  Responsibilities:
  - Styles the application header, navigation, content layout, and dashboard.
  - Defines reusable buttons, forms, tables, cards, and feedback messages.
  - Styles dialogs, loading indicators, member details, and name lists.
  - Provides member combobox, training chart, and role editor presentation.
  - Adapts dashboard and navigation layouts for smaller screens.

  Important:
  - Many selectors correspond directly to classes and IDs in the frontend HTML.
  - Renaming a selector requires updating the associated HTML or JavaScript.
  - Dialog styling relies on the browser's native HTML dialog element.
  - Loading animations depend on the `spin` and `dialog-enter` keyframes.
  - Responsive layout changes occur at 800px and 600px viewport widths.
  - Keep shared component styles consistent when adding new interface sections.

  Dependencies:
  - Frontend HTML elements using the classes and IDs defined in this file.
  - The Inter font when available, with Arial and sans-serif fallbacks.
  - Browser support for CSS Grid, Flexbox, animations, and HTML dialogs.
-->
